<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FCFCFC"/>
            <stop offset="1" stop-color="#E0E0E0"/>
        </linearGradient>

        <linearGradient id="paperGradient" x1="262" y1="200" x2="762" y2="820" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F2F2F5"/>
        </linearGradient>

        <filter id="floatShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
            <feOffset dx="0" dy="14"/>
            <feFlood flood-color="#000000" flood-opacity="0.14"/>
            <feComposite in2="SourceAlpha" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

         <filter id="insetShadow">
            <feOffset dx="0" dy="0"/>
            <feGaussianBlur stdDeviation="12" result="offset-blur"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
            <feFlood flood-color="black" flood-opacity="0.06" result="color"/>
            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
        </filter>
    </defs>

    <!-- Global Scale 95% (Centered) -->
    <!-- Translate logic: 512 * (1 - 0.95) = 25.6 -->
    <g transform="translate(25.6, 25.6) scale(0.95)">
        
        <!-- 1. Background (Sharper Squircle/Rect) -->
        <!-- 
             rx=165: 
             Compensates for the 5% scale down (effective ~156) 
             and adds the requested small increase over the previous 150.
        -->
        <rect id="bgShape" x="72" y="72" width="880" height="880" rx="165" fill="url(#bgGradient)" filter="url(#insetShadow)"/>
        
        <!-- 2. The Paper Document (Same "Perfect" shape as before) -->
        <g filter="url(#floatShadow)">
            <path d="M272 790 
                     V 230 
                     Q 272 200 302 200 
                     H 632 
                     L 752 320 
                     V 790 
                     Q 752 820 722 820 
                     H 302 
                     Q 272 820 272 790 Z" 
                  fill="url(#paperGradient)"/>
                  
            <!-- Folded Corner -->
            <path d="M632 200 
                     V 290 
                     Q 632 320 662 320 
                     H 752 
                     L 632 200 Z" 
                  fill="#D6D6D6"/>
                  
            <!-- Fold Depth -->
            <path d="M632 200 L 752 320 L 632 320 L 632 200 Z" fill="black" fill-opacity="0.04"/>
        </g>

        <!-- 3. Content (Same "Perfect" content) -->
        <g opacity="0.9">
            <!-- Title: Blue -->
            <rect x="332" y="302" width="180" height="18" rx="9" fill="#007AFF"/>
            
            <!-- Subtitle: Grey -->
            <rect x="332" y="342" width="100" height="10" rx="5" fill="#C7C7CC"/>
            
            <!-- Text Lines -->
            <rect x="332" y="392" width="360" height="10" rx="5" fill="#8E8E93"/>
            <rect x="332" y="417" width="340" height="10" rx="5" fill="#8E8E93"/>
            
            <!-- Orange link -->
            <rect x="600" y="417" width="60" height="10" rx="5" fill="#FF9500"/>
            
            <rect x="332" y="442" width="300" height="10" rx="5" fill="#8E8E93"/>
            
            <!-- Code Block -->
            <rect x="332" y="482" width="360" height="60" rx="8" fill="#F0F0F5"/>
            <rect x="352" y="497" width="200" height="8" rx="4" fill="#34C759"/>
            <rect x="352" y="517" width="150" height="8" rx="4" fill="#8E8E93"/>

            <!-- More Text -->
            <rect x="332" y="572" width="360" height="10" rx="5" fill="#8E8E93"/>
            <rect x="332" y="597" width="200" height="10" rx="5" fill="#8E8E93"/>
            
            <!-- Bottom visual element -->
            <rect x="332" y="647" width="280" height="10" rx="5" fill="#8E8E93"/>
        </g>
    </g>
</svg>
