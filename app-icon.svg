<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Standard macOS Squircle Clip/Shape -->
        <path id="squirclePath" d="M128 512C128 196.8 196.8 128 512 128C827.2 128 896 196.8 896 512C896 827.2 827.2 896 512 896C196.8 896 128 827.2 128 512Z" />
        
        <!-- Background Gradient: Subtle off-white/warm grey for a clean desk/surface feel -->
        <linearGradient id="bgGradient" x1="512" y1="128" x2="512" y2="896" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FDFDFD"/>
            <stop offset="1" stop-color="#E8E8E8"/>
        </linearGradient>

        <!-- Paper Gradient: Crisp White -->
        <linearGradient id="paperGradient" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F5F5F7"/>
        </linearGradient>

        <!-- Drop Shadow for the Paper floating on the Squircle -->
        <filter id="floatShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
            <feOffset dx="0" dy="12"/>
            <feFlood flood-color="#000000" flood-opacity="0.12"/>
            <feComposite in2="SourceAlpha" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Inner Shadow for the Squircle (optional, for depth) -->
         <filter id="insetShadow">
            <feOffset dx="0" dy="0"/>
            <feGaussianBlur stdDeviation="10" result="offset-blur"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
            <feFlood flood-color="black" flood-opacity="0.05" result="color"/>
            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
        </filter>
    </defs>

    <!-- 1. The Background Squircle -->
    <use href="#squirclePath" fill="url(#bgGradient)" filter="url(#insetShadow)"/>
    
    <!-- 2. The Paper Document (Centered & Scaled) -->
    <g filter="url(#floatShadow)">
        <!-- Paper Shape (Smaller to fit in squircle) -->
        <!-- Center approx: x=512, y=512. Width ~460, Height ~600 -->
        <path d="M282 780 
                 V 260 
                 Q 282 230 312 230 
                 H 632 
                 L 762 360 
                 V 780 
                 Q 762 810 732 810 
                 H 312 
                 Q 282 810 282 780 Z" 
              fill="url(#paperGradient)"/>
              
        <!-- Folded Corner -->
        <path d="M632 230 
                 V 330 
                 Q 632 360 662 360 
                 H 762 
                 L 632 230 Z" 
              fill="#E0E0E0"/>
              
        <!-- Fold Depth -->
        <path d="M632 230 L 762 360 L 632 360 L 632 230 Z" fill="black" fill-opacity="0.04"/>
    </g>

    <!-- 3. The Content ("Fun" Syntax Highlighting) -->
    <g opacity="0.9">
        <!-- Title: Blue (Header 1) -->
        <rect x="342" y="340" width="180" height="18" rx="9" fill="#007AFF"/>
        
        <!-- Subtitle/Meta: Light Grey -->
        <rect x="342" y="380" width="100" height="10" rx="5" fill="#C7C7CC"/>
        
        <!-- Content Lines: Darker Grey text with some "syntax" color -->
        <rect x="342" y="430" width="360" height="10" rx="5" fill="#8E8E93"/>
        <rect x="342" y="455" width="340" height="10" rx="5" fill="#8E8E93"/>
        
        <!-- A "Link" or emphasized word: Orange -->
        <rect x="610" y="455" width="60" height="10" rx="5" fill="#FF9500"/>
        
        <rect x="342" y="480" width="300" height="10" rx="5" fill="#8E8E93"/>
        
        <!-- Code Block / Quote: Very light grey background box -->
        <rect x="342" y="520" width="380" height="60" rx="8" fill="#F2F2F7"/>
        <!-- Code lines inside -->
        <rect x="362" y="535" width="200" height="8" rx="4" fill="#34C759"/> <!-- Green code -->
        <rect x="362" y="555" width="150" height="8" rx="4" fill="#8E8E93"/>

        <rect x="342" y="610" width="380" height="10" rx="5" fill="#8E8E93"/>
        <rect x="342" y="635" width="200" height="10" rx="5" fill="#8E8E93"/>
    </g>
</svg>